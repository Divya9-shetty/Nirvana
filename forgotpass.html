<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Nirvana</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body, html { height: 100%; }

    /* Background */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 0;
    }

    /* Form container */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px);}
      100% { opacity: 1; transform: translateY(0);}
    }

    h2 { text-align: center; color: #333; margin-bottom: 25px; font-weight: 500; }

    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }

    input {
      width: 100%; padding: 12px 15px; margin-bottom: 20px;
      border-radius: 12px; border: 1px solid #ccc; font-size: 14px;
      outline: none; transition: all 0.3s ease;
      background: #f7f7f7;
      box-shadow: inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #ffffff;
    }
    input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 8px rgba(74,144,226,0.6);
      background: #fff;
    }

    button {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      color: white; font-size: 16px; font-weight: 500;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.25);
    }

    .login-link { text-align: center; margin-top: 15px; font-size: 14px; color: #444; }
    .login-link a { color: #2575fc; text-decoration: none; transition: all 0.3s; }
    .login-link a:hover { text-decoration: underline; }

    input:focus, button:focus { outline: 3px solid rgba(74,144,226,0.5); }

    @media (max-width: 500px) { .container { padding: 30px 20px; border-radius: 10px; } }
  </style>
</head>
<body>
  <div class="container">
    <h2>Forgot Password</h2>
    <form id="forgotForm" aria-label="Forgot Password Form">
      <label for="username">Enter your Username</label>
      <input type="text" id="username" aria-required="true" required>
      <button type="submit">Retrieve Password</button>
      <div class="login-link">
        <a href="login.html">Back to Login</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const userData = localStorage.getItem(username);

      if(!userData){
        alert('User not found.');
        return;
      }

      const user = JSON.parse(userData);
      alert('Your password is: ' + user.password);
    });
  </script>
</body>
</html>
