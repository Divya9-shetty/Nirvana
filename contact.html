<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nirvana — Contact Us</title>
<link rel="stylesheet" href="css/style.css">
<style>
form{max-width:500px;margin:30px auto;display:flex;flex-direction:column;gap:14px;}
input,textarea{padding:10px;border-radius:8px;border:1px solid #ccc;font-size:15px;width:100%;}
textarea{resize:vertical;height:120px;}
button{cursor:pointer;border:none;padding:10px 18px;border-radius:8px;font-weight:600;background:#2563eb;color:white;}
label{font-weight:500;}
.success{color:green;font-weight:500;text-align:center;margin-top:10px;}
</style>
</head>
<body>

<header>
  <h1>Nirvana</h1>
  <nav>
    <a href="dashboard.html">🏠 Dashboard</a>|
    <a href="chatbot.html">💬 Chatbot</a>|
    <a href="assessment.html">🧠 Self Assessment</a>|
    <a href="diary.html">📓 Diary</a>|
    <a href="about.html">ℹ️ About</a>
  </nav>
</header>

<div class="wrap">
  <h1 style="text-align:center;color:#2563eb;">Contact Us</h1>
  <p style="text-align:center;">Have questions or suggestions? Send us a message!</p>

  <form id="contactForm">
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="email">Your Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label for="message">Message</label>
    <textarea id="message" placeholder="Type your message here..." required></textarea>

    <button type="submit">Send Message</button>
    <div id="successMsg" class="success"></div>
  </form>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name=document.getElementById('name').value.trim();
    const email=document.getElementById('email').value.trim();
    const message=document.getElementById('message').value.trim();

    if(!name || !email || !message){alert('Please fill all fields'); return;}

    // For now, just show a success message
    document.getElementById('successMsg').textContent="Thank you! Your message has been received.";
    this.reset();
});
</script>

</body>
</html>
